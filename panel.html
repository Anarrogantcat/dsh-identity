<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>大肥鱼 · QQ 增强</title>
<style>
  :root{
    --glass:1;

    --bg:#0f1420; --bg2:#151c2b; --card:#1a2233; --line:#26314a;
    --fg:#e6ecf7; --dim:#93a1bb; --accent:#4d8dff; --ok:#37c98b; --warn:#f0b34a; --bad:#ff6b6b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:linear-gradient(180deg,var(--bg),#0b1018 60%);color:var(--fg);
    font:14px/1.6 "Segoe UI","Microsoft YaHei",system-ui,sans-serif;min-height:100vh}
  header{padding:18px 22px;border-bottom:1px solid var(--line);background:rgba(26,34,51,.6);
    backdrop-filter:blur(6px);position:sticky;top:0;z-index:5}
  header{position:relative}
  h1{margin:0;font-size:16px;letter-spacing:.4px;display:flex;align-items:center;gap:8px}
  h1 .tag{font-size:11px;color:#0b1018;background:var(--accent);border-radius:999px;padding:1px 8px}
  .sub{color:var(--dim);font-size:12px;margin-top:4px}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .chip{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--dim)}
  .chip.ok{color:var(--ok);border-color:#1f5c43}
  .chip.warn{color:var(--warn);border-color:#5c4a1f}
  .chip.bad{color:var(--bad);border-color:#5c1f1f}
  main{max-width:1040px;margin:0 auto;padding:18px 22px 120px}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 12px}
  .toolbar button{font-size:12.5px;padding:5px 12px}
  .toolbar .hint{margin-left:4px}
  .pcard{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px;background:#151c2b}
  .prow{display:flex;gap:12px;align-items:center;padding:8px 0;border-bottom:1px dashed rgba(38,49,74,.7)}
  .prow:last-child{border-bottom:0}
  .prow .grow{flex:1;min-width:160px}
  .badge{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--dim)}
  .badge.cur{color:#0b1018;background:var(--accent);border-color:var(--accent)}
  .pv{white-space:pre-wrap;font-size:12.5px;color:#cfdcf3;background:#0d1320;border:1px solid var(--line);border-radius:8px;padding:10px;max-height:220px;overflow:auto}
  .pbtns{display:flex;gap:6px;flex-wrap:wrap}
  .pbtns button{font-size:12px;padding:4px 10px}
  .tab{border:1px solid var(--line);background:var(--bg2);color:var(--dim);border-radius:8px;
    padding:6px 12px;cursor:pointer;font-size:13px}
  .tab.active{background:rgba(77,141,255,.14);border-color:#31558f;color:#cfe0ff}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
  .row{display:flex;gap:16px;align-items:center;padding:11px 0;border-bottom:1px dashed rgba(38,49,74,.7)}
  .row:last-child{border-bottom:0}
  .row .meta{flex:1;min-width:220px}
  .row .label{font-size:13.5px}
  .row .hint{color:var(--dim);font-size:12px;margin-top:2px}
  .row .ctl{flex:0 0 300px;display:flex;justify-content:flex-end}
  input,select{background:#0d1320;border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:7px 10px;font:inherit}
  select{cursor:pointer}
  input:focus,select:focus,textarea:focus{outline:none;border-color:#31558f;box-shadow:0 0 0 2px rgba(77,141,255,.15)}
  input[type=text],input[type=number],textarea{background:#0d1320;border:1px solid var(--line);color:var(--fg);
    border-radius:8px;padding:7px 10px;font:inherit;width:100%}
  textarea{min-height:88px;resize:vertical;font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
  input[type=number]{width:140px;text-align:right}
  .copy{font-size:11.5px;padding:2px 8px;border-radius:6px;border:1px solid #2c3a58;background:#1b2537;color:#9fb6dd;cursor:pointer;margin-left:6px}
  .copy:hover{background:#243149;color:#cfe0ff}
  .code{font-family:ui-monospace,Consolas,monospace;letter-spacing:1px;background:#0d1320;border:1px solid #2c3a58;border-radius:6px;padding:2px 8px;color:#cfe0ff}
  .switch{position:relative;width:46px;height:26px;flex:0 0 auto}
  .switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
  .switch i{position:absolute;inset:0;background:#2a3450;border-radius:999px;transition:.18s}
  .switch i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;
    background:#8b9bbb;transition:.18s}
  .switch input:checked + i{background:rgba(77,141,255,.5)}
  .switch input:checked + i::after{left:23px;background:#cfe0ff}
  footer{position:fixed;bottom:0;left:0;right:0;padding:12px 22px;background:rgba(15,20,32,.92);
    border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;justify-content:flex-end}
  button{font:inherit;border-radius:8px;padding:7px 14px;cursor:pointer;border:1px solid var(--line);
    background:var(--bg2);color:var(--fg)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#08111f;font-weight:600}
  button:disabled{opacity:.5;cursor:default}
  #msg{margin-left:auto;margin-right:auto;color:var(--dim);font-size:12.5px}
  .kv{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:var(--dim);word-break:break-all}
  .sec-title{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.8px;margin:18px 0 8px}
  /* 深色滚动条（原来跟随系统是白色，很扎眼） */
  html{scrollbar-color:#33456b #0f1420;scrollbar-width:thin}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:#0f1420}
  ::-webkit-scrollbar-thumb{background:#2c3a58;border-radius:8px;border:2px solid #0f1420}
  ::-webkit-scrollbar-thumb:hover{background:#3b4e75}
  ::-webkit-scrollbar-corner{background:#0f1420}
  textarea,pre{scrollbar-color:#33456b #0d1320}  .searchbar{display:flex;gap:8px;align-items:center;margin:0 0 12px}
  .searchbar input{flex:1;max-width:420px}
  details.adv{margin-top:8px;border-top:1px dashed rgba(38,49,74,.7);padding-top:8px}
  details.adv > summary{cursor:pointer;color:#9fb6dd;font-size:13px;padding:6px 2px;list-style:none;display:flex;align-items:center;gap:6px}
  details.adv > summary::-webkit-details-marker{display:none}
  details.adv > summary::before{content:"▸";color:#4d8dff;transition:transform .15s}
  details.adv[open] > summary::before{transform:rotate(90deg)}
  details.adv[open] > summary{color:#cfe0ff}

  /* ── 毛玻璃 ── */
  body::before{content:"";position:fixed;inset:-25%;z-index:-1;pointer-events:none;
    background:
      radial-gradient(38% 42% at 18% 12%, rgba(77,141,255,.28), transparent 70%),
      radial-gradient(34% 38% at 82% 18%, rgba(120,90,255,.22), transparent 70%),
      radial-gradient(46% 46% at 60% 92%, rgba(55,201,139,.16), transparent 72%),
      radial-gradient(30% 30% at 8% 78%, rgba(240,179,74,.12), transparent 70%);
    filter: blur(28px) saturate(1.05); will-change: auto;
  }
  html.glass-off body::before{display:none}
  html.glass-off .pcard,html.glass-off header,html.glass-off footer,html.glass-off .panel{
    backdrop-filter:none !important;-webkit-backdrop-filter:none !important;
    background:#1a2233 !important;
  }
  header,footer{background:rgba(15,20,32,.72) !important;backdrop-filter:blur(8px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.35)}
  .pcard{background:rgba(26,34,51,.72) !important;backdrop-filter:blur(6px) saturate(1.15);-webkit-backdrop-filter:blur(16px) saturate(1.3);
    border-color:rgba(120,150,210,.16) !important;box-shadow:0 10px 30px rgba(0,0,0,.28)}
  .panel{background:rgba(26,34,51,.62) !important;backdrop-filter:blur(6px) saturate(1.15);-webkit-backdrop-filter:blur(14px) saturate(1.25)}
  .row input,.row select,.row textarea,.searchbar input{background:rgba(13,19,32,.72) !important}
  .tab{backdrop-filter:none}
  table,th,td{background:transparent}
  #qqrefine-wrap{background:rgba(15,20,32,.92) !important;backdrop-filter:none}
  @media (prefers-reduced-transparency: reduce){ html{--glass:0} }

  /* ── S6 面板补齐：常用区 / 通道 / 知识库 / 赛程 / 名册 / 话题 ── */
  .qgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px 16px;margin-top:8px}
  .qcell{min-width:0}
  .qcell .label{font-size:12.5px;color:#cfdcf3}
  .qctl{display:flex;align-items:center;gap:8px;margin-top:4px}
  .qctl input[type=text],.qctl input[type=number],.qctl select{width:100%;min-width:0}
  .kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:2px 18px}
  .kcell{display:flex;gap:8px;align-items:baseline;font-size:12.5px;padding:4px 0;border-bottom:1px dashed rgba(38,49,74,.55);min-width:0}
  .kcell .k{color:var(--dim);flex:0 0 84px;word-break:break-all}
  .kcell .v{color:#cfdcf3;word-break:break-all;flex:1;min-width:0}
  .kcell .v.bad{color:var(--bad)}
  .kcell .ago{color:#7f8ca6;font-size:11.5px;flex:0 0 auto}
  .kcell.hl{background:rgba(77,141,255,.10);border-radius:6px;padding-left:6px;padding-right:6px}
  .caplist{background:#0d1320;border:1px solid var(--line);border-radius:8px;padding:6px 10px}
  .cap{display:flex;gap:8px;align-items:baseline;font-size:12.5px;padding:2px 0}
  .cap.miss{color:#7d8aa3}
  .cap .why{color:#6f7d96;font-size:11.5px;margin-left:auto;text-align:right}
  /* ── 顶栏：通道模式 + 健康度 + 能力位（一眼可见，不用翻页签） ── */
  #topbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px;
    padding:10px 14px;background:linear-gradient(180deg,#141b29,#111826);
    border:1px solid var(--line);border-radius:12px}
  #topbar .tlabel{font-size:12.5px;color:#9fb0c9;margin-right:2px}
  .seg{display:inline-flex;border:1px solid #2c3a58;border-radius:9px;overflow:hidden}
  .seg button{border:0;border-radius:0;padding:6px 13px;background:#151d2c;color:#b9c8e0;font:12.5px/1 inherit;cursor:pointer}
  .seg button+button{border-left:1px solid #2c3a58}
  .seg button.on{background:#2f5b9e;color:#f2f7ff;cursor:default}
  .seg button:disabled{opacity:1}
  #topbar .metrics{display:flex;flex-wrap:wrap;gap:6px 14px;margin-left:auto;align-items:center;font-size:12.5px;color:#a9b8d0}
  #topbar .metrics b{color:#e6eefc;font-weight:600}
  #topbar .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
  #topbar .dot.ok{background:#3ecf8e}#topbar .dot.warn{background:#e5b95c}#topbar .dot.bad{background:#ef6b6b}
</style>
</head>
<body>
<header>
  <h1>🐟 大肥鱼 <span class="tag">QQ 增强</span> <span class="tag" id="stage">v0.5.0</span></h1>
  <div class="sub" id="paths"></div>
  <div class="chips" id="chips"></div>
  <button id="glassBtn" style="position:absolute;right:22px;top:18px;font-size:12px;padding:4px 10px">🫧 毛玻璃</button>
</header>
<main>
  <div id="topbar"></div>
  <div id="quick" class="panel" style="margin-bottom:12px"></div>
  <div class="tabs" id="tabs"></div>
  <div class="searchbar"><input type="text" id="q" placeholder="搜索设置项（跨页签）…"><span class="hint" id="qhint"></span></div>
  <div class="toolbar">
    <button data-act="syncSticker">同步图库</button>
    <button data-act="cleanSticker">清理过期图</button>
    <button data-act="groupDiag">群诊断</button>
    <button data-act="clearRoleCache">清角色缓存</button>
    <span id="actmsg" class="hint"></span>
  </div>
  <div id="recent" class="panel" style="margin-bottom:12px;display:none"></div>
  <div class="panel" id="panel"></div>
  <pre id="actout" class="kv" style="white-space:pre-wrap"></pre>
</main>
<footer>
  <span id="msg"></span>
  <button id="reset">恢复默认</button>
  <button id="save" class="primary">保存</button>
</footer>
<script>
const $ = (id) => document.getElementById(id)
let STATE = null
let ACTIVE = 'scope'
let SEARCH = ""
const draft = {}

// S6：字段表里没有的 key 不进通用渲染；这两个是「面板补录」项（保存后单独核对是否生效）
const SKIP_KEYS = new Set(["frequency.chatMode", "sticker.remoteSource"])
const QUICK_KEYS = ["usage.hardLimitEnabled", "usage.dailyYuanHardLimit", "usage.onExceed", "integration.llmEnabled", "knowledge.enabled"]
const EXTRA_FIELDS = [
  { k: "memory.wBaseline", t: "num", tab: "memory", l: "基础权重 wBaseline（记忆底分）", hint: "召回打分 = wBaseline + 激活 + 重要性 + 情绪；调大 = 更容易想起老事", step: 0.01, min: 0, max: 1 },
  { k: "sticker.genProvider.apiKey", t: "text", tab: "sticker", l: "图像 provider API Key", hint: "自生成表情用的图像接口密钥（字段表里没有它，保存后会核对有没有真的写进去）" },
]
const EXTRA_KEYS = new Set(EXTRA_FIELDS.map((f) => f.k))

function fmt(v){
  if (Array.isArray(v)) return v.join('\n')
  return v === undefined || v === null ? '' : String(v)
}
function get(path){
  if (path in draft) return draft[path]
  return path.split('.').reduce((o,k)=> (o==null?undefined:o[k]), STATE.config)
}
function put(path,val){ draft[path]=val; markDirty() }
function markDirty(){ $('msg').textContent = Object.keys(draft).length ? ('未保存：' + Object.keys(draft).length + ' 项') : '' }

function renderChips(){
  const d = STATE.diag || {}
  const p = d.patch || {}
  const st = STATE.sticker || {}
  const chips = []
  chips.push(['配置', STATE.configPathExists ? 'ok' : 'warn', STATE.configPathExists ? '已生成' : '未生成'])
  const tp = STATE.transport || {}
  if (tp.mode === 'onebot') {
    // 自建通道：官方 SDK / 官方钩子本来就不存在，别拿它们报红
    const ch = tp.channel || {}
    const caps = STATE.capabilities || (tp.capabilities || {})
    const acct = tp.account && tp.account.uin ? (tp.account.uin + (tp.account.nickname ? '（' + tp.account.nickname + '）' : '')) : '未登录'
    chips.push(['通道', tp.connected ? 'ok' : 'bad', tp.connected ? 'OneBot 已连接' : ('未连接' + (tp.lastError ? '：' + tp.lastError : ''))])
    chips.push(['账号', tp.account && tp.account.uin ? 'ok' : 'warn', acct])
    chips.push(['能力位', 'ok', (caps.available || []).length + '/' + (caps.total || 15)])
    chips.push(['入站闸', ch.selfHosted ? 'ok' : 'bad', ch.selfHosted ? '自建通道' : '未挂载'])
    chips.push(['出站', (tp.failedToday || 0) > 2 ? 'warn' : 'ok', '发 ' + (tp.sentToday || 0) + ' / 失败 ' + (tp.failedToday || 0)])
    chips.push(['最近事件', tp.lastEventAt ? 'ok' : 'warn', tp.lastEventAt ? (Math.max(0, Math.round((Date.now() - tp.lastEventAt) / 1000)) + ' 秒前') : '还没收到消息'])
  } else {
    chips.push(['SDK', d.sdkPath ? 'ok' : 'bad', d.sdkPath ? (d.sdkVersion || '已定位') : (d.sdkError || '未定位')])
    chips.push(['入站闸', p.inbound ? 'ok' : 'bad', p.inbound ? '已挂载' : '未挂载'])
    chips.push(['出站脱敏', p.outbound ? 'ok' : 'bad', p.outbound ? '已挂载' : '未挂载'])
  }
  chips.push(['图库', st.total ? 'ok' : 'warn', st.total ? `${st.total} 张` : '空（点“同步图库”）'])
  if (tp.mode !== 'onebot') chips.push(['机器人', STATE.botSeen ? 'ok' : 'warn', STATE.botSeen ? '已连接' : '未收到消息'])
  $('chips').innerHTML = chips.map(([k,s,v])=>`<span class="chip ${s}">${k}：${v}</span>`).join('')
  $('paths').innerHTML = `<span class="kv">配置：${STATE.configPath}</span>`
}

function healthText(h) {
  return h === "ok" ? "正常" : h === "warn" ? "可疑" : "异常"
}

function topbarHtml() {
  const t = STATE.transport || {}
  const c = STATE.capabilities || (t.capabilities || {})
  const isOb = t.mode === "onebot"
  const modeBtn = (id, label, on) => '<button data-mode="' + id + '" class="' + (on ? "on" : "") + '" ' + (on ? 'data-cur="1"' : "") + '>' + label + '</button>'
  const h = t.health || (t.connected ? "ok" : "bad")
  const caps = (c.available || []).length + "/" + (c.total || 15)
  const acct = t.account && t.account.uin ? (t.account.uin + (t.account.nickname ? "（" + t.account.nickname + "）" : "")) : "—"
  const lat = t.latencyMs == null ? "—" : (t.latencyMs + "ms")
  const ago = t.lastEventAt ? (Math.max(0, Math.round((Date.now() - t.lastEventAt) / 1000)) + " 秒前") : "还没有"
  return '<span class="tlabel">通道</span>' +
    '<span class="seg" id="topMode">' + modeBtn("tencent", "官方 QQ", !isOb) + modeBtn("onebot", "NapCat / OneBot", isOb) + '</span>' +
    '<span class="metrics">' +
      '<span><i class="dot ' + h + '"></i>健康度 <b>' + healthText(h) + '</b></span>' +
      '<span>能力位 <b>' + caps + '</b></span>' +
      '<span>账号 <b>' + escapeHtml(acct) + '</b></span>' +
      '<span>延迟 <b>' + lat + '</b></span>' +
      '<span>最近事件 <b>' + ago + '</b></span>' +
      '<span id="topMsg" style="color:#8fa2bd"></span>' +
    '</span>' +
    '<span class="hint" style="flex-basis:100%;margin-top:2px">切模式只写配置，重启 DSH 才生效；详情见「通道」页签</span>'
}

function bindModeButtons(root) {
  if (!root) return
  const msg = $("topMsg") || $("trMsg")
  Array.prototype.forEach.call(root.querySelectorAll("button[data-mode]"), function (b) {
    if (b.getAttribute("data-cur") === "1") { b.disabled = true; return }
    b.onclick = async function () {
      const to = b.getAttribute("data-mode")
      const label = to === "onebot" ? "NapCat / OneBot 11" : "官方 QQ（im-qqbot）"
      if (!confirm("切到「" + label + "」？\n\n只会写配置，重启 DSH 后才真正生效。")) return
      try {
        const j = await saveKey("transport.mode", to)
        if (msg) msg.textContent = j.ok ? ("已切到「" + label + "」→ 重启 DSH 生效") : ("切换失败：" + (j.error || ""))
      } catch (e) { if (msg) msg.textContent = "切换失败：" + e.message }
    }
  })
}

function renderTopbar() {
  const box = $("topbar")
  if (!box) return
  box.innerHTML = topbarHtml()
  bindModeButtons(box)
}

function renderTabs(){
  $('tabs').innerHTML = STATE.tabs.map(([k,name])=>
    `<button class="tab ${k===ACTIVE?'active':''}" data-tab="${k}">${name}</button>`).join('')
  ;[...document.querySelectorAll('.tab')].forEach(b=>b.onclick=()=>{
    ACTIVE=b.dataset.tab
    try{ localStorage.setItem('qqrefine:tab', ACTIVE) }catch{}
    try{ history.replaceState(null, '', '#' + ACTIVE) }catch{}
    const out=$('actout'); if(out) out.textContent=''
    const msg=$('actmsg'); if(msg) msg.textContent=''
    renderTabs(); renderPanel()
    try{ updateToolbar() }catch{}
    try{ window.scrollTo(0, 0) }catch{}
  })
}

function learnCardHtml(){
  var list = STATE.learnDetail || []
  if (!list.length) return '<div class="pcard"><div class="label">会学习</div><div class="hint">还没学到东西。管理员在群里说「不要用敬语」「记住：只聊技术」「以后叫我小鱼」她就会记下来；她每说一句，有人接就算一次正反馈。</div></div>'
  var rows = list.map(function (v) {
    var name = v.scope === 'group' ? ('群 ' + String(v.peer || v.peerKey).slice(0, 8)) : (v.scope === 'c2c' ? ('私聊 ' + String(v.peer || v.peerKey).slice(0, 8)) : String(v.peerKey).slice(0, 10))
    var rules = (v.rules || []).map(function (r) { return '<li>' + r + '</li>' }).join('')
    var stat = v.sent ? ('说 ' + v.sent + ' 次 / 被接 ' + v.reacted + ' 次（' + Math.round((v.rate || 0) * 100) + '%）→ 活跃倍率 ×' + v.factor) : '接话样本还不够（满 10 次才调活跃度）'
    return '<div style="margin:6px 0"><div class="label">' + name + ' <span class="hint">规矩 ' + (v.ruleCount || 0) + ' 条</span></div>' +
      (rules ? '<ul style="margin:2px 0 2px 18px;padding:0;color:#c9d6ea;font-size:13px">' + rules + '</ul>' : '') +
      '<div class="hint">' + stat + '</div></div>'
  }).join('')
  var kb = STATE.kb, mt = STATE.matches

function renderPanel(){

  try { const _el = $("panel"); if (_el) _el.innerHTML = "" } catch {}
  if (ACTIVE === "persona") { renderPersonaPanel(); return }
  if (ACTIVE === "profile") { renderProfilePanel(); return }
  if (ACTIVE === "scope") { renderScopeClaim(); return }
  if (ACTIVE === "knowledge") { renderKbPanel(); return }
  if (ACTIVE === "matches") { renderMatchesPanel(); return }

  const el = $("panel")
  const q = (SEARCH || "").trim().toLowerCase()
  const allFields = (STATE.fields || []).filter((f) => !SKIP_KEYS.has(f.k))
  const fields = q
    ? allFields.filter((f) => (f.l + " " + f.k + " " + (f.hint || "")).toLowerCase().includes(q))
    : allFields.filter((f) => f.tab === ACTIVE)

  if (q && fields.length === 0) {
    el.innerHTML = '<div class="pcard"><div class="hint">没有匹配「' + q + '」的设置项</div></div>'

  const advanced = fields.filter((f) => !isCommon(f.k))

  el.innerHTML = `

    <div class="pcard">

      var mr = $("moodreset"); if (mr) mr.onclick = async function () { await mg({ action: "mgmtOp", kind: "mood", op: "resetLocal" }); await load() }

function fieldRow(f, tabLabel) {
  const v = get(f.k)
  let ctl = ""
  if (f.t === "bool") ctl = `<label class="switch"><input type="checkbox" data-k="${f.k}" ${v ? "checked" : ""}><i></i></label>`
  else if (f.t === "num") ctl = `<input type="number" data-k="${f.k}" value="${v ?? ""}" step="${f.step || 1}" min="${f.min ?? ""}" max="${f.max ?? ""}">`
  else if (f.t === "list") ctl = `<textarea data-k="${f.k}" spellcheck="false">${(Array.isArray(v) ? v.join("\n") : (v ?? ""))}</textarea>`
  else if (f.t === "range") {
    const cur = v == null ? (f.min ?? 0) : v
    ctl = '<div style="display:flex;align-items:center;gap:10px;width:100%">' +
      '<input type="range" data-k="' + f.k + '" min="' + (f.min ?? 0) + '" max="' + (f.max ?? 100) + '" step="' + (f.step || 1) + '" value="' + cur + '" style="flex:1;min-width:120px">' +
      '<span class="hint" data-rv="' + f.k + '" style="min-width:38px;text-align:right">' + cur + '</span></div>'
  }
  else if (f.t === "select" && Array.isArray(f.options)) {
    const cur = v == null ? "" : String(v)
    const opts = f.options.map((o) => (typeof o === "string" ? { v: o, l: o } : o))
    const known = opts.some((o) => String(o.v) === cur)
    ctl = '<select data-k="' + f.k + '">' + opts.map((o) =>
      '<option value="' + escapeHtml(String(o.v)) + '"' + (String(o.v) === cur ? " selected" : "") + '>' + escapeHtml(String(o.l || o.v)) + '</option>').join("") +
      (known ? "" : '<option value="' + escapeHtml(cur) + '" selected>' + escapeHtml(cur || "（空）") + '</option>') +
      '</select>'
  }
  else ctl = `<input type="text" data-k="${f.k}" value="${(v ?? "").toString().replace(/"/g, "&quot;")}">`
  return `<div class="row"><div class="meta"><div class="label">${f.l}${tabLabel ? ` <span class="badge">${tabLabel}</span>` : ""}</div>${f.hint ? `<div class="hint">${f.hint}</div>` : ""}</div><div class="ctl">${ctl}</div></div>`
}

async function load(){
  const sigOf = (s) => {
    try { return [s.version, JSON.stringify(s.config).length, s.transport && s.transport.mode, (s.transport && s.transport.channel && s.transport.channel.counts && s.transport.channel.counts.inbound) || 0, (s.roster && s.roster.updatedAt) || 0, (s.kb && s.kb.chunks) || 0].join("|") } catch (e) { return String(Date.now()) }
  }
  const r = await fetch('/api/qqbot-refine/state')
  STATE = await r.json()
  if (!STATE.ok) { $('msg').textContent = '读取失败：' + (STATE.error||''); return }
  for (const k of Object.keys(draft)) delete draft[k]
  try { const hh = (location.hash || "").replace(/^#/, ""); if (hh && STATE.tabs.some((t) => t[0] === hh)) ACTIVE = hh } catch {}
  // 状态没变就别重画（刷新/切页时的卡顿主要来自整页重建）
  const sig = sigOf(STATE)
  if (sig === (window.__qqrefineSig || "") && $("panel").childElementCount > 0) { renderChips(); renderTopbar(); markDirty(); return }
  window.__qqrefineSig = sig
  await ensurePeerKeys()
  renderQuick()
  renderChips(); renderTopbar(); renderTabs(); renderPanel(); markDirty(); try { updateToolbar() } catch {}
  const qi = $("q"); if (qi) { qi.value = SEARCH; qi.oninput = () => { SEARCH = qi.value; renderPanel() } }
  const rbox = $("recent"); if (rbox) rbox.style.display = "none"
  $('stage').textContent = STATE.version ? ('v' + STATE.version) : (STATE.stage || 'v0.5.0')
}

async function save(){
  const btn = $('save'); btn.disabled = true
  try{
    const r = await fetch('/api/qqbot-refine/config', {
      method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({patch: draft})
    })
    const j = await r.json()
    if (j.ok){
      const sent = Object.assign({}, draft)
      for (const k of Object.keys(draft)) delete draft[k]
      await load()
      const bad = verifyExtras(sent)
      $('msg').textContent = bad.length
        ? ('已保存，但没有生效：' + bad.join('、') + '（宿主字段表里还没有它 → 更新/重启 DSH 后再试）')
        : '已保存 ✓（热生效）'
    }
    else {
      const keys = Object.keys(draft)
      const known = new Set((STATE.fields || []).map((f) => f.k))
      const onlyExtra = keys.length > 0 && keys.every((k) => EXTRA_KEYS.has(k) && !known.has(k))
      const noField = /没有可应用的字段/.test(j.error || '')
      $('msg').textContent = (onlyExtra || noField) && onlyExtra
        ? ('这次只有面板补录字段（' + keys.join('、') + '），宿主字段表里还没有它们，写不进去 → 更新/重启 DSH 后再试')
        : '保存失败：' + (j.error||'')
    }
  }catch(e){ $('msg').textContent = '保存失败：' + e.message }
  finally{ btn.disabled = false }
}

}

async function runAction(action){
  const msg = $('actmsg'), outEl = $('actout')
  msg.textContent = '执行中…'; outEl.textContent = ''
  try{
    const r = await fetch('/api/qqbot-refine/action', {
      method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({action})
    })
    const j = await r.json()
    msg.textContent = j.ok ? '完成 ✓' : ('失败：' + (j.error||''))
    if (action === 'groupDiag') {
      const groups = j.groups || []
      if (!groups.length) outEl.textContent = '群诊断结果：白名单里还没有群。先把群加进来。'
      else {
        outEl.textContent = '群诊断结果（缓存里的群主/管理员）：\n' + groups.map((g, i) => {
          const admins = (g.admins || []).map((a) => '   · ' + a.openid + '（' + a.role + '）').join('\n')
          return (i + 1) + '. 群 ' + g.group + '\n' + (admins || '   · 还没有识别到群管（接口未成功，或群里还没人发言）')
        }).join('\n\n')
      }
    } else if (action === "syncSticker") {
      const r = j.result || {}
      if (!r.ok) outEl.textContent = "同步失败：" + (r.error || j.error || "")
      else {
        const lines = ["图库同步结果：新增 " + r.added + "，共 " + r.total + " 张"]
        for (const s of (r.sources || [])) lines.push("· " + s.host + " → " + (s.ok ? ("新增 " + s.added + " / 源内 " + s.count) : ("失败：" + s.error)))
        outEl.textContent = lines.join("\n")
      }
    } else {
      outEl.textContent = JSON.stringify(j.result ?? j, null, 2).slice(0, 3000)
    }
    if (action === 'syncSticker' || action === 'cleanSticker') await load()
  }catch(e){ msg.textContent = '失败：' + e.message }
}

        <textarea id="pmText" spellcheck="false" style="width:100%;height:52vh;resize:vertical;font-family:ui-monospace,Consolas,monospace">${(data.text || "").replace(/</g, "&lt;")}</textarea>
      </div>
      <div style="padding:10px 16px;border-top:1px solid #26314a;display:flex;gap:8px;justify-content:flex-end">
        <button class="copy" id="pmCopyText">复制正文</button>
        <button id="pmSaveNew">保存为新</button>
        ${!builtin && id ? '<button id="pmSaveSame" class="primary">保存修改</button>' : ""}
      </div>
    </div>`
  document.body.appendChild(wrap)
  $("pmClose").onclick = closePresetModal
  wrap.addEventListener("click", (e) => { if (e.target === wrap) closePresetModal() })
  $("pmCopyText").onclick = (e) => copyText($("pmText").value, e.target)

  const save = async (sameId) => {
    const name = $("pmName").value.trim()
    const text = $("pmText").value.trim()
    if (!name || text.length < 4) { $("pmMsg").textContent = "名称和正文都要填"; return }
    const payload = { action: "presetSave", name, text }
    if (sameId) payload.id = sameId
    const r = await fetch("/api/qqbot-refine/action", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(payload) })
    const j = await r.json()
    if (j.ok) { closePresetModal(); await loadPersona() }
    else $("pmMsg").textContent = "保存失败：" + (j.error || "")
  }
  $("pmSaveNew").onclick = () => save(null)
  const same = $("pmSaveSame")
  if (same) same.onclick = () => save(id)
}

function renderPersonaPanel() {
  const el = $("panel")
  if (!PERSONA) { el.innerHTML = '<div class="hint">加载人设库…</div>'; loadPersona(); return }
  const cur = PERSONA.presets.find((p) => p.id === PERSONA.current)
  const byGroup = PERSONA.byGroup || {}
  const byUser = PERSONA.byUser || {}
  const groups = (STATE.config.scope.groups || [])
  const dms = (STATE.config.scope.dmUsers || [])
  const tab = (id, label) => `<button class="tab ${PSC === id ? "active" : ""}" data-psc="${id}">${label}</button>`
  const opts = PERSONA.presets.map((p) => `<option value="${p.id}">${p.name}${p.enabled ? "" : "（停用）"}</option>`).join("")

  let body = ""
  if (PSC === "global") {
    body = PERSONA.presets.map((p) => `
      <div class="prow">
        <div class="grow">
          <div class="label">${p.name} ${p.id === PERSONA.current ? '<span class="badge cur">当前</span>' : ""}
            <span class="badge">${p.builtin ? "内置" : "导入"}</span>
            ${p.enabled ? "" : '<span class="badge">已停用</span>'}</div>
          <div class="hint">${p.desc || ""} · ${p.chars} 字</div>
        </div>
        <div class="pbtns">
          <button data-pview="${p.id}">查看</button>
          <button data-pedit="${p.id}">${p.builtin ? "另存为" : "编辑"}</button>
          <button data-pcur="${p.id}">设为当前</button>
          <button data-ptog="${p.id}" data-on="${p.enabled ? 1 : 0}">${p.enabled ? "停用" : "启用"}</button>
          ${p.builtin ? "" : `<button data-pdel="${p.id}">删除</button>`}
        </div>
      </div>`).join("")
  } else if (PSC === "group") {
    body = groups.length ? groups.map((g) => `
      <div class="prow">
        <div class="grow"><div class="label">群 ${g}</div><div class="hint">未指定时回落到「全局当前」</div></div>
        <select data-pscope="group" data-key="${g}"><option value="">（回落全局）</option>${opts}</select>
      </div>`).join("") : '<div class="hint">白名单里还没有群。先把群加进来，再回来指定人设。</div>'
  } else {
    body = dms.length ? dms.map((u) => `
      <div class="prow">
        <div class="grow"><div class="label">用户 ${u}</div><div class="hint">未指定时回落到「全局当前」</div></div>
        <select data-pscope="user" data-key="${u}"><option value="">（回落全局）</option>${opts}</select>
      </div>`).join("") : '<div class="hint">私聊白名单里还没有人。</div>'
  }

  const scaleNow = Number((draft['persona.scale'] != null ? draft['persona.scale'] : (STATE.config.persona && STATE.config.persona.scale)) ?? 50)
  const scaleWord = scaleNow <= 25 ? '保守' : scaleNow <= 50 ? '日常' : scaleNow <= 75 ? '放松' : '放飞'
  const scaleCard = `<div class="pcard" id="scaleCard">
    <div class="label">聊天尺度 <span class="badge cur" id="scaleWord">${scaleWord} · ${scaleNow}</span></div>
    <div class="hint">往左＝克制礼貌，往右＝会接梗、会损人、允许脏话荤段子。只改语气，事实与安全底线不变。改完点右下角「保存」。</div>
    <div style="display:flex;align-items:center;gap:12px;margin-top:10px">
      <span class="hint">保守</span>
      <input type="range" id="pscale" min="0" max="100" step="5" value="${scaleNow}" style="flex:1;min-width:160px">
      <span class="hint">放飞</span>
    </div>
  </div>`

  el.innerHTML = `${scaleCard}
    <div class="pcard">
      <div class="tabs">${tab("global", "全局")}${tab("group", "按群")}${tab("user", "按私聊")}</div>
      <div class="hint">越细越优先：按私聊/按群 → 全局当前。只对 QQ 会话生效，Web 会话不受影响。</div>
    </div>
    <div class="pcard">
      <div class="row" style="border-bottom:0;padding:0 0 8px">
        <div class="meta">
          <div class="label">QQ 专属人设注入：<b style="color:${STATE.config.persona.enabled ? "#37c98b" : "#f0b34a"}">${STATE.config.persona.enabled ? "已开启" : "未开启（当前用全局人设）"}</b></div>
          <div class="hint">当前选中：<b>${cur ? cur.name : "（未选）"}</b>${STATE.config.persona.enabled ? "" : " · 点右边开启只对 QQ 生效的这套人设"}</div>
        </div>
        <div class="ctl pbtns"><button data-ptoggle class="${STATE.config.persona.enabled ? "" : "primary"}">${STATE.config.persona.enabled ? "关闭注入" : "开启注入"}</button></div>
      </div>
      ${body}
    </div>
    <div class="pcard">
      <details class="adv"><summary>导入 / 新建人设</summary>
      <div class="row"><div class="meta"><input type="text" id="pname" placeholder="人设名称"></div></div>
      <textarea id="ptext" placeholder="把人设正文粘进来…（建议 100–800 字）"></textarea>
      <div class="pbtns" style="margin-top:8px"><button id="psave" class="primary">保存为人设</button><button id="pnew">打开编辑器</button><span id="pmsg" class="hint"></span></div>
      </details>
    </div>`

  const sc = el.querySelector('#pscale')
  if (sc) {
    const wordOf = (n) => n <= 25 ? '保守' : n <= 50 ? '日常' : n <= 75 ? '放松' : '放飞'
    const upd = () => {
      const n = Number(sc.value)
      const w = el.querySelector('#scaleWord')
      if (w) w.textContent = wordOf(n) + ' · ' + n
      put('persona.scale', n)
    }
    sc.oninput = upd
    sc.onchange = upd
  }

  const ptg = el.querySelector("[data-ptoggle]")
  if (ptg) ptg.onclick = async () => {
    const next = !STATE.config.persona.enabled
    const r = await fetch("/api/qqbot-refine/config", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ patch: { "persona.enabled": next } }) })
    const j = await r.json()
    if (j.ok) await load()
    else alert("保存失败：" + (j.error || ""))
  }
  ;[...el.querySelectorAll("[data-psc]")].forEach((b) => { b.onclick = () => { PSC = b.dataset.psc; renderPersonaPanel() } })
  ;[...el.querySelectorAll("[data-pcur]")].forEach((b) => { b.onclick = () => pcall({ action: "setCurrent", id: b.dataset.pcur }) })
  ;[...el.querySelectorAll("[data-ptog]")].forEach((b) => { b.onclick = () => pcall({ action: "presetToggle", id: b.dataset.ptog, enabled: b.dataset.on !== "1" }) })
  ;[...el.querySelectorAll("[data-pdel]")].forEach((b) => { b.onclick = () => { if (confirm("删除这条人设？")) pcall({ action: "presetDelete", id: b.dataset.pdel }) } })
  ;[...el.querySelectorAll("[data-pview]")].forEach((b) => { b.onclick = () => openPresetModal(b.dataset.pview, "view") })
  ;[...el.querySelectorAll("[data-pedit]")].forEach((b) => { b.onclick = () => openPresetModal(b.dataset.pedit, "edit") })
  ;[...el.querySelectorAll("[data-pscope]")].forEach((s) => {
    s.value = (s.dataset.pscope === "group" ? byGroup[s.dataset.key] : byUser[s.dataset.key]) || ""
    s.onchange = () => pcall({ action: "setScope", scope: s.dataset.pscope, key: s.dataset.key, id: s.value || null })
  })
  const save = $("psave")
  if (save) save.onclick = () => {
    const name = $("pname").value.trim()
    const text = $("ptext").value.trim()
    if (!name || text.length < 4) { $("pmsg").textContent = "名称和正文都要填"; return }
    pcall({ action: "presetSave", name, text })
  }
  const nw = $("pnew")
  if (nw) nw.onclick = () => openPresetModal(null, "edit")
}

// ── 通用管理表 ──
const MGMT = { memory: "memoryPeers", sticker: "stickers", order: "audit", bili: "biliSubs", usage: "usage" }
let MPICK = ""

async function mg(payload) {
  const r = await fetch("/api/qqbot-refine/action", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(payload) })
  return r.json()
}

async function loadMgmt(kind, box) {
  const j = await mg({ action: "mgmt", kind, key: MPICK })
  let items = null
  if (kind === "memoryPeers" && MPICK) items = await mg({ action: "mgmt", kind: "memoryItems", key: MPICK })
  renderMgmt(kind, j, box, items)
}

function rowHtml(kind, r) {
  const btns = []
  if (["groups", "dmUsers", "owners", "admins", "biliSubs"].includes(kind)) btns.push(`<button data-mrm="${r.value}">删除</button>`)
  if (kind === "memoryPeers") btns.push(`<button data-mpick="${r.value}">查看</button>`)
  if (kind === "memoryItems") btns.push(`<button data-mforget="${r.id}">删除</button><button data-mpin="${r.id}">pin</button>`)
  if (kind === "stickers") btns.push(`<button data-mdel="${r.id}">删除</button>`)
  if (kind === "usage") {
    return `<div class="prow"><div class="grow"><div class="label">${r.k}</div></div>
      <div class="ctl" style="flex:0 0 auto"><b style="color:#cfe0ff">${r.v}</b></div></div>`
  }
  const text = Object.values(r).filter((v) => v !== undefined && v !== "").join(" · ")
  return `<div class="prow"><div class="grow"><div class="label">${text}</div></div><div class="pbtns">${btns.join("")}</div></div>`
}

function renderMgmt(kind, data, box, items) {
  const rows = data.rows || []
  const addRow = ["groups", "dmUsers", "owners", "admins", "biliSubs"].includes(kind)
    ? `<div class="row"><div class="meta"><input id="madd" placeholder="粘贴 ${kind === "biliSubs" ? "UP mid" : "openid"}"></div><div class="ctl"><button id="maddb">添加</button></div></div>`
    : ""
  let html = `<div class="hint" style="margin-bottom:8px">${data.hint || ""}</div>${addRow}`
  html += '<div style="background:#0d1320;border:1px solid var(--line);border-radius:8px;padding:4px 10px">' +
    (rows.length ? rows.map((r) => rowHtml(kind, r)).join("") : '<div class="hint" style="padding:8px 0">暂无数据</div>') + "</div>"
  if (kind === "groups") {
    const b = STATE.bind
    const left = b ? Math.max(1, Math.round((b.expiresAt - Date.now()) / 60000)) : 0
    html += `<div class="row"><div class="meta"><div class="label">绑定码</div><div class="hint">${b ? `当前：<b>${b.code}</b>（用途 ${b.purpose}，剩 ${left} 分钟）` : "生成后，在 QQ 里发：#绑定 <码>"}</div></div><div class="ctl pbtns"><button data-bind="owner">绑 Owner</button><button data-bind="group">绑本群</button><button data-bind="dm">绑私聊</button>${b ? '<button data-bindcancel>作废</button>' : ""}</div></div>`
  }
  if (kind === "usage") html += '<div class="pbtns" style="margin-top:8px"><button id="mreset">重置计数</button><button id="mresetCost">重置花费闸</button><span class="hint">花费闸：超限会降级回模板 / 静默</span><button id="mroles">清角色缓存</button></div>'
  if (kind === "memoryPeers" && items) {
    html += `<div class="hint" style="margin:10px 0 6px">peer ${MPICK} 的记忆（${(items.rows || []).length} 条）</div>`
    html += '<div style="background:#0d1320;border:1px solid var(--line);border-radius:8px;padding:4px 10px">' +
      ((items.rows || []).length ? items.rows.map((r) => rowHtml("memoryItems", r)).join("") : '<div class="hint" style="padding:8px 0">这个 peer 还没有记忆</div>') + "</div>"
  }
  box.innerHTML = html

  const addBtn = $("maddb")
  if (addBtn) addBtn.onclick = async () => {
    const v = $("madd").value.trim()
    if (!v) return
    const j = await mg({ action: "mgmtOp", kind, op: "add", value: v })
    if (!j.ok) { box.insertAdjacentHTML("afterbegin", `<div class="hint" style="color:#ff6b6b">${j.error || "失败"}</div>`); return }
    await load(); await loadMgmt(kind, $("mgmt"))
  }
  ;[...box.querySelectorAll("[data-mrm]")].forEach((b) => {
    b.onclick = async () => { await mg({ action: "mgmtOp", kind, op: "remove", value: b.dataset.mrm }); await load(); await loadMgmt(kind, $("mgmt")) }
  })
  ;[...box.querySelectorAll("[data-mpick]")].forEach((b) => {
    b.onclick = async () => { MPICK = b.dataset.mpick; await loadMgmt(kind, $("mgmt")) }
  })
  ;[...box.querySelectorAll("[data-mforget]")].forEach((b) => {
    b.onclick = async () => { await mg({ action: "mgmtOp", kind: "memoryItems", op: "forget", peerKey: MPICK, id: b.dataset.mforget }); await loadMgmt(kind, $("mgmt")) }
  })
  ;[...box.querySelectorAll("[data-mpin]")].forEach((b) => {
    b.onclick = async () => { await mg({ action: "mgmtOp", kind: "memoryItems", op: "pin", peerKey: MPICK, id: b.dataset.mpin, pinned: true }); await loadMgmt(kind, $("mgmt")) }
  })
  ;[...box.querySelectorAll("[data-mdel]")].forEach((b) => {
    b.onclick = async () => { if (!confirm("删除这张表情？")) return; await mg({ action: "mgmtOp", kind: "stickers", op: "remove", id: b.dataset.mdel }); await loadMgmt(kind, $("mgmt")) }
  })
  ;[...box.querySelectorAll("[data-bind]")].forEach((b2) => {
    b2.onclick = async () => {
      const j = await mg({ action: "bindNew", purpose: b2.dataset.bind, ttlMin: 10 })
      if (j.ok) { await load(); await loadMgmt(kind, $("mgmt")) }
    }
  })
  const bc = box.querySelector("[data-bindcancel]")
  if (bc) bc.onclick = async () => { await mg({ action: "bindCancel" }); await load(); await loadMgmt(kind, $("mgmt")) }
  const rs = $("mreset")
  if (rs) rs.onclick = async () => { await mg({ action: "mgmtOp", kind: "usage", op: "resetDiag" }); await loadMgmt(kind, $("mgmt")) }
  const rc2 = $("mresetCost")
  if (rc2) rc2.onclick = async () => { await mg({ action: "mgmtOp", kind: "usage", op: "resetCost" }); await loadMgmt(kind, $("mgmt")) }
  const rc = $("mroles")
  if (rc) rc.onclick = async () => { await mg({ action: "mgmtOp", kind: "roles", op: "clearCache" }); await loadMgmt(kind, $("mgmt")) }
}

// ── 白名单 / 层级：三条认领路 ──
async function scopeOp(payload) {
  const r = await fetch("/api/qqbot-refine/action", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(payload) })
  return r.json()
}

async function claimAdd(kind, value) {
  if (!value) return
  const j = await scopeOp({ action: "mgmtOp", kind, op: "add", value })
  if (!j.ok) alert(/未知操作|unknown/i.test(j.error || "") ? "宿主还是旧代码，请重启 DSH" : (j.error || "添加失败"))
  await load()
}

function listCard(title, kind, rows, hint) {
  const body = (rows || []).length
    ? rows.map((r) => `<div class="prow"><div class="grow"><div class="label">${r}</div></div><div class="pbtns"><button class="copy" data-copy="${r}">复制</button><button data-rm="${kind}|${r}">删除</button></div></div>`).join("")
    : '<div class="hint" style="padding:6px 0">暂无</div>'
  return `<div class="pcard"><div class="label" style="margin-bottom:6px">${title} ${hint ? '<span class="hint">' + hint + '</span>' : ''}</div>${body}</div>`
}

function renderScopeClaim() {
  // §scope-clear§ 这里必须清空：后面用 beforeend 追加
  const el = $("panel")
  el.innerHTML = ""
  el.insertAdjacentHTML("beforeend", rosterCardHtml())
  try { bindRosterCard() } catch (e) {}
  const cfg = STATE.config
  const groups = cfg.scope.groups || []
  const dms = cfg.scope.dmUsers || []
  const owners = cfg.roles.owners || []
  const admins = cfg.roles.admins || []
  const b = STATE.bind
  const left = b ? Math.max(1, Math.round((b.expiresAt - Date.now()) / 60000)) : 0

  // 按群/人聚合最近来源（同一群只出现一次）
  const raw = (STATE.recentPeers || []).filter((x) => String(x.peer || "").length >= 16 && String(x.sender || "").length >= 16)
  const buckets = new Map()
  for (const x of raw) {
    const key = x.scope + ":" + x.peer
    let e = buckets.get(key)
    if (!e) { e = { scope: x.scope, peer: x.peer, at: x.at, senders: new Map() }; buckets.set(key, e) }
    if (String(x.at) > String(e.at)) e.at = x.at
    if (!e.senders.has(x.sender)) e.senders.set(x.sender, x.at)
  }
  const list = [...buckets.values()].sort((a, c) => String(c.at).localeCompare(String(a.at)))

  const isGroup = (a) => a.scope === "group"
  const groupRow = (e) => {
    const who = isGroup(e) ? "群" : "私聊"
    const already = isGroup(e) ? groups.includes(e.peer) : dms.includes(e.peer)
    const n = e.senders.size
    const senders = [...e.senders.entries()]
    const senderLine = (sid, at) => `<div class="prow" style="padding:4px 0;border-bottom:0">
        <div class="grow"><div class="hint" style="font-size:12px">发送者 ${sid} · ${new Date(at).toLocaleTimeString()}</div></div>
        <div class="pbtns"><button class="copy" data-copy="${sid}">复制</button><button data-owner="${sid}">设为 Owner</button></div>
      </div>`
    const head = `<div class="prow" style="border-bottom:1px solid rgba(38,49,74,.6)">
      <div class="grow">
        <div class="label">${who} · ${e.peer}
          ${already ? '<span class="badge cur">已在白名单</span>' : ""}
          <span class="badge">${n} 人</span></div>
        <div class="hint">最近 ${new Date(e.at).toLocaleTimeString()}</div>
      </div>
      <div class="pbtns">
        <button class="copy" data-copy="${e.peer}">复制 openid</button>
        ${already ? "" : `<button data-addgroup="${e.peer}" data-scope="${e.scope}">加白名单</button>`}
      </div>
    </div>`
    const visible = senders.slice(0, 2).map(([sid, at]) => senderLine(sid, at)).join("")
    const rest = senders.length > 2
      ? `<details class="adv" style="borderTop:0"><summary>还有 ${senders.length - 2} 位发言者</summary>${senders.slice(2).map(([sid, at]) => senderLine(sid, at)).join("")}</details>`
      : ""
    return `<div class="pcard" style="margin-bottom:10px;padding:10px 12px">${head}${visible}${rest}</div>`
  }

  const recentHtml = list.length
    ? list.slice(0, 4).map(groupRow).join("") +
      (list.length > 4 ? `<details class="adv"><summary>还有 ${list.length - 4} 个群/人（展开）</summary>${list.slice(4).map(groupRow).join("")}</details>` : "")
    : '<div class="pcard"><div class="hint" style="padding:6px 0">还没有来源记录。让她先收到一条消息（群里 @ 她一句），这里就会出现。</div></div>'

  const listCard = (title, kind, rows, hint) => {
    const body = (rows || []).length
      ? rows.map((r) => `<div class="prow"><div class="grow"><div class="label">${r}</div></div><div class="pbtns"><button class="copy" data-copy="${r}">复制</button><button data-rm2="${kind}|${r}">删除</button></div></div>`).join("")
      : '<div class="hint" style="padding:6px 0">暂无</div>'
    return `<div class="pcard"><div class="label" style="margin-bottom:6px">${title}${hint ? ` <span class="hint">${hint}</span>` : ""}</div>${body}</div>`
  }

  el.insertAdjacentHTML("beforeend", `
    <div class="pcard">
      <div class="label" style="margin-bottom:8px">认领方式① 最近来源（按群聚合）</div>
      ${recentHtml}
    </div>
    <div class="pcard">
      <div class="label" style="margin-bottom:8px">认领方式② 绑定码（最稳）</div>
      <div id="claimmsg" class="hint" style="color:#f0b34a;min-height:18px"></div>
      <div class="hint" style="margin-bottom:8px">${b ? `当前码：<span class="code">${b.code}</span><button class="copy" data-copy="${b.code}">复制码</button><button class="copy" data-copy="#绑定 ${b.code}">复制命令</button>（用途 ${b.purpose}，剩 ${left} 分钟）` : "还没有码：点下面任一按钮生成（一次性、10 分钟有效）。"}</div>
      <div class="pbtns">
        <button data-bind="owner">绑 Owner</button>
        <button data-bind="group">绑本群</button>
        <button data-bind="dm">绑私聊</button>
        ${b ? '<button data-bindcancel>作废</button>' : ""}
      </div>
    </div>
    <div class="pcard">
      <details class="adv"><summary>认领方式③ 手动填 openid</summary>
        <div class="row"><div class="meta"><input id="claimval" placeholder="粘贴 openid / UP mid"></div>

function escapeHtml(s) {
  return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
}

// 字段绑定（面板内 + 顶部常用区共用）：只认 STATE.fields 与 EXTRA_FIELDS
function bindFields(root) {
  if (!root) return
  ;[...root.querySelectorAll("[data-k]")].forEach(function (input) {
    const k = input.dataset.k
    const f = (STATE.fields || []).find(function (x) { return x.k === k }) ||
      EXTRA_FIELDS.find(function (x) { return x.k === k })
    if (!f) return
    const ev = (f.t === "bool" || f.t === "list" || f.t === "text" || f.t === "select") ? "change" : "input"
    input.addEventListener(ev, function () {
      let val
      if (f.t === "bool") val = input.type === "checkbox" ? !!input.checked : input.value === "true"
      else if (f.t === "num") val = Number(input.value)
      else if (f.t === "list") val = input.value.split(new RegExp("[\r\n,，]")).map(function (s) { return s.trim() }).filter(Boolean)
      else if (f.t === "range") val = Number(input.value)
      else val = input.value
      if (f.t === "range") { const rv = document.querySelector('[data-rv="' + k + '"]'); if (rv) rv.textContent = String(val) }
      put(k, val)
      syncInputs(k, val, input)
    })
  })
}

// 同一个字段可能在「顶部常用区」和「页内」各有一份，改一处同步另一处
function syncInputs(k, val, skipEl) {
  ;[...document.querySelectorAll('[data-k="' + k + '"]')].forEach(function (el) {
    if (!el || el === skipEl) return
    if (el.type === "checkbox") { el.checked = !!val; return }
    if (el.tagName === "SELECT") { el.value = String(val == null ? "" : val); return }
    el.value = Array.isArray(val) ? val.join("\n") : String(val == null ? "" : val)
  })
}

// 补录字段核对：字段表里没有的 key，服务端会静默丢掉，这里保存后查一次
function verifyExtras(sent) {
  const bad = []
  const known = new Set((STATE.fields || []).map(function (f) { return f.k }))
  Object.keys(sent || {}).forEach(function (k) {
    if (known.has(k) || !EXTRA_KEYS.has(k)) return
    const cur = k.split(".").reduce(function (o, x) { return o == null ? undefined : o[x] }, STATE.config)
    const want = sent[k]
    const same = (typeof want === "number" && typeof cur === "number")
      ? Math.abs(want - cur) < 1e-9
      : String(cur) === String(want)
    if (!same) bad.push(k)
  })
  return bad
}

// 群号 → peerKey（g_ + sha256 前 12 位），与服务端 store.peerKey 一致
async function ensurePeerKeys() {
  PK_MAP = {}
  PK_BY_GROUP = {}
  PK_ERROR = ""
  const choices = STATE.groupChoices || []
  if (!choices.length) return
  if (typeof crypto === "undefined" || !crypto.subtle || typeof TextEncoder === "undefined") {
    PK_ERROR = "这个页面拿不到 SHA-256（不是安全上下文），单群文件名请手动填"
    return
  }
  try {
    for (const g of choices) {
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(String(g.id)))
      const hex = Array.prototype.map.call(new Uint8Array(buf), function (b) { return ("0" + b.toString(16)).slice(-2) }).join("").slice(0, 12)
      const pk = "g_" + hex
      PK_BY_GROUP[String(g.id)] = pk
      PK_MAP[pk] = { id: g.id, name: g.name || "" }
    }
  } catch (e) {
    PK_ERROR = "算群标识失败：" + e.message
  }
}

function groupLabelOfPeer(pk) {
  const hit = PK_MAP[String(pk)]
  if (hit) return "群 " + (hit.name || String(hit.id))
  return String(pk || "").slice(0, 12)
}

    '<div class="hint" style="margin-bottom:4px">这几项面板原来没有入口；保存后会核对是否真的写进配置（写不进去会明确提示）。</div>' +
    rows.map(function (f) { return fieldRow(f, "") }).join("") + '</div>'
}

// ── 通道卡片 ──
function transportCardHtml() {
  const t = STATE.transport
  if (!t) return '<div class="pcard"><div class="label">通道</div><div class="hint">读不到通道状态（宿主没返回 transport）</div></div>'
  const caps = STATE.capabilities || t.capabilities || null
  const capCnt = caps ? ((caps.available || []).length + "/" + caps.total) : "—"
  const acct = (t.account && t.account.uin) ? (String(t.account.uin) + (t.account.nickname ? "（" + t.account.nickname + "）" : "")) : "—"
  const breaker = !!(t.breaker && t.breaker.open)
  const sent = t.sentToday == null ? null : t.sentToday
  const failed = t.failedToday == null ? null : t.failedToday
  const rate = t.successRate == null ? "—" : (t.successRate + "%")
  const modeTxt = t.mode === "onebot" ? "OneBot（自建 / NapCat）" : "官方 QQ（im-qqbot）"
  const other = t.mode === "onebot" ? "官方 QQ · 未启用" : "OneBot · 未启用"
  const items = [
    ["连接", t.connected ? "已连接" : "未连接"],
    ["账号", acct],
    ["地址", t.endpoint || "—"],
    ["延迟", t.latencyMs == null ? "—" : (t.latencyMs + " ms")],
    ["最近事件", fmtAgo(t.lastEventAt)],
    ["重连", (t.reconnects == null ? 0 : t.reconnects) + " 次"],
    ["今日发送", "成功 " + (sent == null ? "—" : sent) + " · 失败 " + (failed == null ? "—" : failed) + " · 成功率 " + rate],
    ["会话数", t.channel && t.channel.sessions != null ? t.channel.sessions : 0],
    ["熔断", breaker ? ("保护中（到 " + new Date(t.breaker.until).toLocaleString() + "）") : "正常"],
    ["最后错误", t.lastError || "—"],
    ["能力位", capCnt],
    ["看图", (t.channel && t.channel.vision) ? (t.channel.vision.rejected ? "模型不收图（已降级纯文字）" : (t.channel.vision.attachment ? ("可用" + (t.channel.vision.lastSkip ? "（上次跳过：" + t.channel.vision.lastSkip + "）" : "")) : "缺 attachments 服务")) : "—"],
    ["另一条通道", other],
  ]
  const isOb = t.mode === "onebot"
  const modeBtn = (id, label, on) => '<button data-mode="' + id + '" class="' + (on ? 'primary' : '') + '" ' + (on ? 'disabled' : '') + '>' + label + (on ? " ✓" : "") + '</button>'
  return '<div class="pcard" id="trCard">' +
    '<div class="label" style="margin:0 0 4px">通道模式（单活：同一时刻只走一条）</div>' +
    '<div class="pbtns" id="trMode">' +
      modeBtn("tencent", "官方 QQ（im-qqbot）", !isOb) +
      modeBtn("onebot", "NapCat / OneBot 11", isOb) +
      '<span class="hint" style="margin-left:8px">提交后要重启 DSH 才生效；官方号配置会留着，随时能切回</span>' +
    '</div>' +
    '<div class="row" style="border-bottom:0;padding:6px 0 6px"><div class="meta">' +
      '<div class="label">当前通道：' + modeTxt + ' ' + healthChip(t.health) + '</div>' +
      '<div class="hint">改通道模式（transport.mode）要重启 DSH 才生效；面板只写配置，不会热切。</div>' +
    '</div><div class="ctl pbtns">' +
      '<button id="trPing">测延迟</button>' +
      (breaker ? '<button id="trBreaker">重置熔断</button>' : "") +
      '<button id="trReload">重新读状态</button>' +
    '</div></div>' +
    '<div class="kgrid">' + items.map(function (x) {
      const bad = x[0] === "最后错误" && !!t.lastError
      return '<div class="kcell"><span class="k">' + x[0] + '</span><span class="v' + (bad ? " bad" : "") + '">' + escapeHtml(x[1]) + '</span></div>'
    }).join("") + '</div>' +
    '<div class="hint" id="trMsg" style="margin-top:8px;min-height:16px"></div>' +
    '<div class="label" style="margin:10px 0 4px">能力位清单（缺失的置灰）</div>' +
    '<div id="trCaps" class="caplist"><div class="hint">加载能力位…</div></div>' +
    '<details class="adv"><summary>通道数据（服务端原样）</summary><div id="trRows" style="margin-top:6px"><div class="hint">加载…</div></div></details>' +
  '</div>'
}

function fallbackCapsHtml() {
  const c = STATE.capabilities || (STATE.transport && STATE.transport.capabilities)
  if (!c) return '<div class="hint">能力位读不到</div>'
  const ok = c.available || []
  const miss = c.missing || []
  return ok.map(function (k) {
    return '<div class="cap"><span>✅</span><span>' + escapeHtml(CAP_NAMES[k] || k) + '</span></div>'
  }).join("") + miss.map(function (k) {
    const why = c.mode === "tencent" ? "官方模式不支持，切 onebot 可用" : "当前不可用"
    return '<div class="cap miss"><span>⬜</span><span>' + escapeHtml(CAP_NAMES[k] || k) + '</span><span class="why">' + escapeHtml(why) + '</span></div>'
  }).join("")
}

async function saveKey(key, value) {
  const r = await fetch("/api/qqbot-refine/config", {
    method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({ patch: { [key]: value } })
  })
  const j = await r.json()
  await load()
  return j
}

async function bindTransportCard() {
  const msg = $("trMsg")
  bindModeButtons($("trMode"))
  ;[...document.querySelectorAll("[data-preset]")].forEach(function (b) {
    b.onclick = function () {
      const id = b.getAttribute("data-preset")
      put("transport.onebot.preset", id)
      const input = document.querySelector('input[data-k="transport.onebot.preset"]')
      if (input) input.value = id
      const m = $("presetMsg")
      if (m) m.textContent = "已选 " + id + "（还没保存；点右下角「保存」后重启 DSH 生效）"
      try { renderPanel(); bindTabCards() } catch (e) {}
    }
  })
  const ping = $("trPing")
  if (ping) ping.onclick = async function () {
    if (msg) msg.textContent = "测延迟中…"
    try {
      const j = await mg({ action: "mgmtOp", kind: "transport", op: "ping" })
      if (msg) msg.textContent = j.ok ? "已发出测活，1 秒后重读状态…" : ("测延迟失败：" + (j.error || ""))
      if (j.ok) setTimeout(function () { load() }, 1000)
    } catch (e) { if (msg) msg.textContent = "测延迟失败：" + e.message }
  }
  const br = $("trBreaker")
  if (br) br.onclick = async function () {
    try {
      const j = await mg({ action: "mgmtOp", kind: "safety", op: "resetBreaker" })
      if (msg) msg.textContent = j.ok ? "熔断已重置" : ("重置失败：" + (j.error || ""))
      if (j.ok) await load()
    } catch (e) { if (msg) msg.textContent = "重置失败：" + e.message }
  }
  const rl = $("trReload")
  if (rl) rl.onclick = function () { load() }
  const capsBox = $("trCaps")
  const rowsBox = $("trRows")
  try {
    const j = await mg({ action: "mgmt", kind: "transport" })
    const rows = (j && j.rows) || []
    if (rowsBox) rowsBox.innerHTML = rows.length ? renderKv(rows) : '<div class="hint">没有数据</div>'
    const capRows = rows.filter(function (r) { return /^[✅⬜]/.test(String(r.k || "")) })
    if (capsBox) {
      if (capRows.length) {
        capsBox.innerHTML = capRows.map(function (r) {
          const ok = String(r.k).charAt(0) === "✅"
          const name = String(r.k).slice(2)
          const why = ok ? "" : '<span class="why">' + escapeHtml(r.v || "") + '</span>'
          return '<div class="cap ' + (ok ? "" : "miss") + '"><span>' + (ok ? "✅" : "⬜") + '</span><span>' + escapeHtml(name) + '</span>' + why + '</div>'
        }).join("")
      } else {
        capsBox.innerHTML = fallbackCapsHtml()
      }
    }
  } catch (e) {
    if (capsBox) capsBox.innerHTML = fallbackCapsHtml()
    if (rowsBox) rowsBox.innerHTML = '<div class="hint" style="color:#ff6b6b">读通道数据失败：' + escapeHtml(e.message) + '</div>'
  }
}

function bindCardsCard() {

  const out = $("cardsOut")

  b.onclick = async function () {
    const sel = $("cardsGroup")
    const gid = sel ? sel.value : ""
    if (!gid) { if (out) out.textContent = "先选一个群（白名单里还没有群的话先去「白名单 / 层级」加一个）"; return }
    const pk = PK_BY_GROUP[String(gid)]
    if (!pk) { if (out) out.textContent = PK_ERROR || "算不出这个群的标识"; return }
    if (out) out.textContent = "读取中…"
    try {
      const j = await mg({ action: "mgmt", kind: "cards", key: pk })
      if (!j || j.ok === false) { if (out) out.textContent = "失败：" + ((j && j.error) || ""); return }
      const rows = j.rows || []
      if (out) out.textContent = rows.length ? rows.map(function (r) { return String(r.v == null ? "" : r.v) }).join("\n") : "（没有内容）"
    } catch (e) { if (out) out.textContent = "失败：" + e.message }
  }
}

async function loadSafety(box) {
  if (!box) return
  try {
    const j = await mg({ action: "mgmt", kind: "safety" })
    const rows = (j && j.rows) || []
    box.innerHTML = renderKv(rows) +
      '<div class="row" style="border-bottom:0;padding:8px 0 0"><div class="meta">' +
        '<div class="label">熔断 / 被踢的群</div>' +
        '<div class="hint">连续 3 次发送失败会自动保护 30 分钟并通知 Owner；被踢的群会自动从白名单摘掉。</div>' +
      '</div><div class="ctl pbtns">' +
        '<input type="text" id="safetyGroup" placeholder="群号（解封用）" style="width:150px">' +
        '<button id="safetyUnban">解封</button><button id="safetyReset">重置熔断</button>' +
      '</div></div>' +
      '<div class="hint" id="safetyMsg" style="min-height:16px"></div>'
    const rs = $("safetyReset")
    if (rs) rs.onclick = async function () {
      try {
        const r = await mg({ action: "mgmtOp", kind: "safety", op: "resetBreaker" })
        const m = $("safetyMsg")
        if (m) m.textContent = r.ok ? "熔断已重置" : ("失败：" + (r.error || ""))
        if (r.ok) await loadSafety(box)
      } catch (e) { const m = $("safetyMsg"); if (m) m.textContent = "失败：" + e.message }
    }
    const ub = $("safetyUnban")
    if (ub) ub.onclick = async function () {
      const gi = $("safetyGroup")
      const v = gi ? gi.value.trim() : ""
      const m = $("safetyMsg")
      if (!v) { if (m) m.textContent = "先填群号"; return }
      try {
        const r = await mg({ action: "mgmtOp", kind: "safety", op: "unban", group: v })
        if (m) m.textContent = r.ok ? ("已解封 " + v) : ("失败：" + (r.error || ""))
        if (r.ok) await loadSafety(box)
      } catch (e) { if (m) m.textContent = "失败：" + e.message }
    }
  } catch (e) {
    box.innerHTML = '<div class="hint" style="color:#ff6b6b">读安全状态失败：' + escapeHtml(e.message) + '</div>'
  }
}

async function bindRosterCard() {
  const say = function (s) { const m = $("rosterMsg"); if (m) m.textContent = s }
  const rf = $("rosterRefresh")
  if (rf) rf.onclick = async function () {
    say("刷新中…（1 秒后自动重读）")
    try {
      const j = await mg({ action: "mgmtOp", kind: "roster", op: "refresh" })
      if (!j.ok) { say("刷新失败：" + (j.error || "")); return }
      say("已提交刷新，1 秒后重读…")
      setTimeout(function () { load() }, 1000)
    } catch (e) { say("刷新失败：" + e.message) }
  }
  const prune = $("rosterPrune")
  if (prune) prune.onclick = async function () {
    if (!confirm("清掉白名单里「旧通道」留下的 openid 条目？\n（真实群号 / QQ 号不会被删）")) return
    try {
      const a = await mg({ action: "mgmtOp", kind: "groups", op: "pruneLegacy" })
      const b = await mg({ action: "mgmtOp", kind: "dmUsers", op: "pruneLegacy" })
      say("已清理：群 " + (a.removed || 0) + " 条，私聊 " + (b.removed || 0) + " 条")
      await load()
    } catch (e) { say("清理失败：" + e.message) }
  }
  const sel = $("rosterGroup")
  const add = $("rosterAdd")
  if (add) {
    const syncBtn = function () {
      const gid = sel ? sel.value : ""
      const inList = ((STATE.config.scope && STATE.config.scope.groups) || []).indexOf(gid) >= 0
      add.disabled = !gid || inList
      add.textContent = inList ? "已在白名单" : "加入白名单"
    }
    if (sel) sel.onchange = syncBtn
    syncBtn()
    add.onclick = async function () {
      const gid = sel ? sel.value : ""
      if (!gid) { say("先选一个群"); return }
      try {
        const j = await mg({ action: "mgmtOp", kind: "groups", op: "add", value: gid })
        if (!j.ok) { say("加入失败：" + (j.error || "")); return }
        say("已加入白名单：" + gid)
        await load()
      } catch (e) { say("加入失败：" + e.message) }
    }
  }
  const box = $("rosterRows")
  if (box) {
    try {
      const j = await mg({ action: "mgmt", kind: "roster" })
      box.innerHTML = (j && j.rows && j.rows.length) ? renderKv(j.rows) : '<div class="hint">没有名册数据</div>'
    } catch (e) {
      box.innerHTML = '<div class="hint" style="color:#ff6b6b">读名册失败：' + escapeHtml(e.message) + '</div>'
    }
  }
}

// ── 知识库页 ──
async function renderKbPanel() {
  const el = $("panel")
  try {
    const kb = STATE.kb || {}
    const cfg = STATE.config || {}
    const kcfg = cfg.knowledge || {}
    const choices = STATE.groupChoices || []
    const gopts = '<option value="">（全群共用 common.md）</option>' + choices.map(function (g) {
      return '<option value="' + escapeHtml(g.id) + '">' + escapeHtml(g.id) + (g.name ? "（" + escapeHtml(g.name) + "）" : "") +
        " · " + (g.count == null ? 0 : g.count) + " 人</option>"
    }).join("")
    const kbOn = kcfg.enabled !== false
    el.innerHTML =
      '<div class="pcard">' +
        '<div class="label" style="margin-bottom:6px">知识库</div>' +
        '<div class="hint">目录：<span class="kv">' + escapeHtml(kb.dir || "（未配置）") + '</span></div>' +
        '<div class="hint">文件 ' + (kb.files == null ? "—" : kb.files) + ' · 段 ' + (kb.chunks == null ? "—" : kb.chunks) +
          (kb.providers && kb.providers.length ? " · 来源 " + escapeHtml(kb.providers.join(" / ")) : "") +
          (kb.esports == null ? "" : " · 赛程段 " + kb.esports) + '</div>' +
        '<div class="hint">common.md 所有群共享；g_xxx.md 只给那个群。markdown 改完立即生效（每次检索都重读）。总闸：' +
          (kbOn ? "已开启" : "已关闭（去「记忆」页打开 knowledge.enabled）") + '</div>' +
        '<div id="kbStats" style="margin-top:8px"><div class="hint">加载统计…</div></div>' +
      '</div>' +
      '<div class="pcard">' +
        '<div class="label" style="margin-bottom:6px">预览</div>' +
        '<div class="row" style="border-bottom:0;padding:0 0 6px"><div class="meta"><div class="label">看哪个群的文件</div>' +
          '<div class="hint" id="kbHint">' + escapeHtml(PK_ERROR || "选群自动填单群文件名；不知道就手动输入") + '</div></div>' +
          '<div class="ctl"><select id="kbGroup">' + gopts + '</select></div></div>' +
        '<div class="row" style="border-bottom:0;padding:0 0 6px"><div class="meta"><div class="label">文件名</div>' +
          '<div class="hint">单群文件名 = g_ + 群号 sha256 前 12 位 + .md</div></div>' +
          '<div class="ctl"><input type="text" id="kbFile" value="common.md"></div></div>' +
        '<div class="pbtns" style="margin-top:6px"><button id="kbPreview">预览</button><span id="kbMsg" class="hint"></span></div>' +
        '<pre class="pv" id="kbOut" style="max-height:300px;margin-top:8px">还没预览</pre>' +
      '</div>' +
      '<div class="pcard">' +
        '<div class="label" style="margin-bottom:6px">检索试跑</div>' +
        '<div class="hint">输入一句话，看会命中哪几段（top 5；分越高越相关）。</div>' +
        '<div class="row" style="border-bottom:0;padding:6px 0"><div class="meta"><input type="text" id="kbQ" placeholder="例如：今天谁打谁"></div>' +
          '<div class="ctl pbtns"><button id="kbGo" class="primary">试跑</button></div></div>' +
        '<div id="kbHits"><div class="hint">还没有试跑</div></div>' +
      '</div>'

    const gsel = $("kbGroup")
    if (gsel) gsel.onchange = function () {
      const gid = gsel.value
      const fi = $("kbFile")
      const msg = $("kbMsg")
      if (!gid) { if (fi) fi.value = "common.md"; return }
      const pk = PK_BY_GROUP[String(gid)]
      if (pk) { if (fi) fi.value = pk + ".md"; if (msg) msg.textContent = "" }
      else if (msg) msg.textContent = PK_ERROR || "算不出这个群的标识，单群文件请在下面输入文件名"
    }
    const pv = $("kbPreview")
    if (pv) pv.onclick = async function () {
      const fi = $("kbFile")
      const out = $("kbOut")
      const msg = $("kbMsg")
      const file = fi ? fi.value.trim() : ""
      if (!file) { if (msg) msg.textContent = "先填文件名"; return }
      if (msg) msg.textContent = "读取中…"
      try {
        const j = await mg({ action: "mgmt", kind: "knowledgePreview", key: file })
        if (!j || j.ok === false) { if (msg) msg.textContent = "失败：" + ((j && j.error) || ""); return }
        const rows = j.rows || []
        const txt = rows.map(function (r) { return String(r.v == null ? "" : r.v) }).join("\n")
        if (out) out.textContent = txt || "（空文件）"
        if (msg) msg.textContent = j.hint || "读完 ✓"
      } catch (e) {
        if (msg) msg.textContent = "失败：" + e.message
        if (out) out.textContent = ""
      }
    }
    const go = $("kbGo")
    if (go) go.onclick = async function () {
      const qi = $("kbQ")
      const box = $("kbHits")
      const q = qi ? qi.value.trim() : ""
      if (!q) { if (box) box.innerHTML = '<div class="hint">先输入一句话</div>'; return }
      if (box) box.innerHTML = '<div class="hint">检索中…</div>'
      try {
        const j = await mg({ action: "mgmt", kind: "knowledgeSearch", key: q })
        const rows = (j && j.rows) || []
        if (box) box.innerHTML = rows.length
          ? '<div class="kgrid">' + rows.map(function (r) {
              return '<div class="kcell"><span class="k">' + escapeHtml(r.title || "") + '</span>' +
                '<span class="v">' + escapeHtml(r.text || "") + '</span>' +
                '<span class="ago">' + escapeHtml(r.score || "") + '</span></div>'
            }).join("") + '</div>' +
              '<div class="hint" style="margin-top:6px">' + escapeHtml((j && j.hint) || "") + '</div>'
          : '<div class="hint">没命中（换句话试试，或检查文件里有没有对应关键词）</div>'
      } catch (e) {
        if (box) box.innerHTML = '<div class="hint" style="color:#ff6b6b">检索失败：' + escapeHtml(e.message) + '</div>'
      }
    }
    const stats = $("kbStats")
    if (stats) {
      try {
        const j = await mg({ action: "mgmt", kind: "knowledge" })
        stats.innerHTML = (j && j.rows && j.rows.length) ? renderKv(j.rows) : '<div class="hint">统计读不到</div>'
      } catch (e) {
        stats.innerHTML = '<div class="hint" style="color:#ff6b6b">统计读不到：' + escapeHtml(e.message) + '</div>'
      }
    }
  } catch (e) {
    el.innerHTML = '<div class="pcard"><div class="hint" style="color:#ff6b6b">知识库页渲染失败：' + escapeHtml(e.message) + '</div></div>'
  }
}

// ── 赛程页 ──
async function renderMatchesPanel() {
  const el = $("panel")
  try {
    const st = STATE.matches || {}
    const d = new Date()
    const todayStr = d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2)
    const notice = MATCH_NOTICE
    MATCH_NOTICE = ""
    const latest = st.latest
      ? ("最近：" + String(st.latest.date || "") + " " + String(st.latest.team1 || "") + " vs " + String(st.latest.team2 || ""))
      : "还没有记录"
    el.innerHTML =
      '<div class="pcard">' +
        '<div class="label" style="margin-bottom:6px">赛程速查</div>' +
        '<div class="hint">已录 ' + (st.total == null ? "—" : st.total) + ' 场 · 涉及战队 ' + (st.teams == null ? "—" : st.teams) + ' · ' + escapeHtml(latest) + '</div>' +
        '<div class="hint">群里发「#赛程 …」也能录；面板录入会覆盖「同一天 + 同一对阵」的旧记录。</div>' +
      '</div>' +
      '<div class="pcard">' +
        '<div class="label" style="margin-bottom:6px">录入</div>' +
        '<div class="qgrid">' +
          formCell("日期", '<input type="text" id="mDate" value="' + todayStr + '" placeholder="YYYY-MM-DD">') +
          formCell("队 1", '<input type="text" id="mTeam1" placeholder="HLE">') +
          formCell("队 2", '<input type="text" id="mTeam2" placeholder="IG">') +
          formCell("比分", '<input type="text" id="mScore" placeholder="2:1（可留空）">') +
          formCell("联赛", '<input type="text" id="mLeague" placeholder="Worlds 2026">') +
          formCell("备注", '<input type="text" id="mNote" placeholder="瑞士轮 R3">') +
        '</div>' +
        '<div class="row" style="border-bottom:0;padding:8px 0 0"><div class="meta"><div class="hint" id="matchMsg">' +
          escapeHtml(notice || "今天的比赛录进来，面板会高亮。") + '</div></div>' +
          '<div class="ctl pbtns"><button id="matchSave" class="primary">保存</button></div></div>' +
      '</div>' +
      '<div class="pcard">' +
        '<div class="row" style="border-bottom:0;padding:0 0 6px"><div class="meta"><div class="label">全部记录（最新 30 条）</div>' +
          '<div class="hint">今天的行高亮；「待补」= 比分还没录。</div></div>' +
          '<div class="ctl pbtns"><button id="matchesReload">刷新</button></div></div>' +
        '<div id="matchesBox"><div class="hint">加载…</div></div>' +
      '</div>' +
      '<div class="pcard">' +
        '<div class="label" style="margin-bottom:6px">交手查询</div>' +
        '<div class="qgrid">' +
          formCell("队 A", '<input type="text" id="h2hA" placeholder="HLE">') +
          formCell("队 B（留空 = 关键词搜索）", '<input type="text" id="h2hB" placeholder="IG">') +
        '</div>' +
        '<div class="pbtns" style="margin-top:8px"><button id="h2hGo">查交手</button>' +
          '<span class="hint">两边都填 = 交手记录；只填 A = 关键词搜索</span></div>' +
        '<div id="h2hBox" style="margin-top:8px"><div class="hint">还没有查</div></div>' +
      '</div>'

    const val = function (id) { const e2 = $(id); return e2 ? e2.value.trim() : "" }
    const saveBtn = $("matchSave")
    if (saveBtn) saveBtn.onclick = async function () {
      const msg = $("matchMsg")
      const payload = {
        action: "mgmtOp", kind: "matches", op: "add",
        date: val("mDate"), team1: val("mTeam1"), team2: val("mTeam2"),
        score: val("mScore"), league: val("mLeague"), note: val("mNote"),
      }
      if (!payload.team1 || !payload.team2) { if (msg) msg.textContent = "两个队名都要填"; return }
      saveBtn.disabled = true
      try {
        const j = await mg(payload)
        if (!j.ok) { if (msg) msg.textContent = "保存失败：" + (j.error || ""); return }
        MATCH_NOTICE = "已保存：" + payload.date + " " + payload.team1 + " vs " + payload.team2 +
          "（共 " + (j.total == null ? "?" : j.total) + " 场）"
        await load()
      } catch (e) {
        if (msg) msg.textContent = "保存失败：" + e.message
      } finally {
        saveBtn.disabled = false
      }
    }
    const rel = $("matchesReload")
    if (rel) rel.onclick = function () { loadMatchesTable() }
    const h2h = $("h2hGo")
    if (h2h) h2h.onclick = async function () {
      const box = $("h2hBox")
      const A = val("h2hA")
      const B = val("h2hB")
      if (!A) { if (box) box.innerHTML = '<div class="hint">先填队名 A</div>'; return }
      if (box) box.innerHTML = '<div class="hint">查询中…</div>'
      try {
        const j = await mg({ action: "mgmt", kind: "matchesH2H", key: A, b: B })
        const rows = (j && j.rows) || []
        if (box) box.innerHTML = (j && j.hint ? '<div class="hint">' + escapeHtml(j.hint) + '</div>' : "") +
          (rows.length
            ? '<div class="kgrid">' + rows.map(function (r) {
                return '<div class="kcell"><span class="k">' + escapeHtml(r.date || "") + '</span>' +
                  '<span class="v">' + escapeHtml(r.teams || "") + '</span>' +
                  '<span class="ago">' + escapeHtml(r.score || "") + '</span></div>'
              }).join("") + '</div>'
            : '<div class="hint">没有交手记录</div>')
      } catch (e) {
        if (box) box.innerHTML = '<div class="hint" style="color:#ff6b6b">查询失败：' + escapeHtml(e.message) + '</div>'
      }
    }
    await loadMatchesTable()
  } catch (e) {
    el.innerHTML = '<div class="pcard"><div class="hint" style="color:#ff6b6b">赛程页渲染失败：' + escapeHtml(e.message) + '</div></div>'
  }
}

async function loadMatchesTable() {
  const box = $("matchesBox")
  if (!box) return
  try {
    const j = await mg({ action: "mgmt", kind: "matches" })
    const rows = (j && j.rows) || []
    box.innerHTML = rows.length
      ? '<div class="kgrid" style="grid-template-columns:1fr">' + rows.map(function (r) {
          const isToday = !!r.today
          const parts = String(r.teams || "").split(" vs ")
          const t1 = parts[0] || ""
          const t2 = parts[1] || ""
          return '<div class="kcell' + (isToday ? " hl" : "") + '">' +
            '<span class="k">' + escapeHtml(r.date || "") + (isToday ? ' <span class="badge cur">今天</span>' : "") + '</span>' +
            '<span class="v">' + escapeHtml(r.teams || "") + '</span>' +
            '<span class="ago">' + escapeHtml(r.score || "") + (r.league ? " · " + escapeHtml(r.league) : "") + '</span>' +
            '<span class="pbtns"><button data-mdel2="' + escapeHtml((r.date || "") + "|" + t1 + "|" + t2) + '">删除</button></span></div>'
        }).join("") + '</div>'
      : '<div class="hint">还没有赛程记录；上面录一条试试。</div>'
    ;[...box.querySelectorAll("[data-mdel2]")].forEach(function (b) {
      b.onclick = async function () {
        const seg = String(b.dataset.mdel2).split("|")
        const msg = $("matchMsg")
        if (!confirm("删除 " + seg[0] + " " + seg[1] + " vs " + seg[2] + " ？")) return
        try {
          const r = await mg({ action: "mgmtOp", kind: "matches", op: "remove", date: seg[0], team1: seg[1], team2: seg[2] })
          if (!r.ok) { if (msg) msg.textContent = "删除失败：" + (r.error || ""); return }
          if (msg) msg.textContent = "已删除 " + (r.removed == null ? 0 : r.removed) + " 条"
          await loadMatchesTable()
        } catch (e) { if (msg) msg.textContent = "删除失败：" + e.message }
      }
    })
  } catch (e) {
    box.innerHTML = '<div class="hint" style="color:#ff6b6b">读赛程失败：' + escapeHtml(e.message) + '</div>'
  }
}

// ── 页签卡片的事件绑定 ──
function assetsCardHtml() {
  const a = STATE.assets
  if (!a) return '<div class="pcard"><div class="label">语音资源</div><div class="hint">读不到资源状态</div></div>'
  const ptr = a.pointer ? ("指针文件 → " + a.pointer) : "未设指针（用默认数据目录）"
  const rows = (a.items || []).map(function (it) {
    const pr = (a.progress || {})[it.id]
    let st = it.installed ? ("已下载 " + it.gotMB + "MB" + (it.looksComplete ? "" : "（可能不完整）")) : "未下载"
    if (pr && pr.ok === null && !pr.doneAt) st = "下载中…"
    if (pr && pr.ok === false) st = "失败：" + (pr.error || "")
    return '<div class="kcell"><span class="k">' + escapeHtml(it.name) + '</span>' +
      '<span class="v">' + escapeHtml(st) + '<div class="hint" style="margin-top:2px">' + escapeHtml(it.note || "") +
      ' · 约 ' + it.sizeMB + 'MB</div></span>' +
      '<span class="pbtns">' +
        (it.installed ? '<button data-adel="' + escapeHtml(it.id) + '">删除</button>'
                      : '<button data-adl="' + escapeHtml(it.id) + '" class="primary">下载</button>') +
      '</span></div>'
  }).join("")
  return '<div class="pcard" id="assetsCard">' +
    '<div class="row" style="border-bottom:0;padding:0 0 6px"><div class="meta">' +
      '<div class="label">语音资源（大文件，默认放数据目录）</div>' +
      '<div class="hint">数据目录：' + escapeHtml(a.dataDir || "") + ' · ' + escapeHtml(ptr) + '</div>' +
      '<div class="hint">下载目录：' + escapeHtml(a.root || "") + '</div>' +
      (a.sttAuto ? '<div class="hint">自动命令：' + escapeHtml(a.sttAuto) + '</div>' : "") +
    '</div><div class="ctl pbtns">' +
      '<button id="assetsReload">刷新状态</button>' +
      (a.sttAuto ? '<button id="assetsApplyStt">启用转写（写入 stt.command）</button>' : "") +
    '</div></div>' +
    '<div class="kgrid" style="grid-template-columns:1fr">' + (rows || '<div class="hint">清单为空</div>') + '</div>' +
    '<div class="hint" style="margin-top:8px">装 whisper：下载模型 + 安装 whisper-cli（whisper.cpp 发布包）并把 whisper-cli 放进 PATH；' +
    'ffmpeg 解压后把 bin 目录加进 PATH。语音转写只影响入站语音，不装也能正常聊天（会显示 [语音]）。</div>' +
    '<div class="hint">C 盘放不下：把整个数据目录挪到别的盘 → 在项目里跑 <code>scripts/move-data.ps1 -Target D:\qqbot-data</code>，或只改「大文件下载目录」字段。</div>' +
    '<div class="hint" id="assetsMsg" style="min-height:16px"></div>' +
  '</div>'
}

function bindAssetsCard() {
  const say = function (s) { const m = $("assetsMsg"); if (m) m.textContent = s }
  const rl = $("assetsReload")
  if (rl) rl.onclick = function () { say("重新读状态…"); load() }
  ;[...document.querySelectorAll("[data-adl]")].forEach(function (b) {
    b.onclick = async function () {
      const id = b.getAttribute("data-adl")
      b.disabled = true
      say("已开始下载（大文件，放后台跑；点「刷新状态」看进度）")
      try {
        const j = await fetch("/api/qqbot-refine/action", {
          method: "POST", headers: { "content-type": "application/json" },
          body: JSON.stringify({ action: "downloadAsset", id: id })
        })
        const r = await j.json()
        if (!r.ok) say("启动失败：" + (r.error || ""))
      } catch (e) { say("启动失败：" + e.message) }
      setTimeout(function () { load() }, 1500)
    }
  })
  ;[...document.querySelectorAll("[data-adel]")].forEach(function (b) {
    b.onclick = async function () {
      const id = b.getAttribute("data-adel")
      if (!confirm("删掉已下载的这个资源？")) return
      try {
        const j = await fetch("/api/qqbot-refine/action", {
          method: "POST", headers: { "content-type": "application/json" },
          body: JSON.stringify({ action: "removeAsset", id: id })
        })
        const r = await j.json()
        say(r.ok ? "已删除" : ("删除失败：" + (r.error || "")))
        load()
      } catch (e) { say("删除失败：" + e.message) }
    }
  })
  const ap = $("assetsApplyStt")
  if (ap) ap.onclick = async function () {
    try {
      const j = await fetch("/api/qqbot-refine/action", {
        method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ action: "applySttCommand" })
      })
      const r = await j.json()
      say(r.ok ? ("已写入 stt.command 并打开开关：" + r.command) : ("失败：" + (r.error || "")))
      load()
    } catch (e) { say("失败：" + e.message) }
  }
}

function bindTabCards() {
  if (ACTIVE === "channel") bindTransportCard()
  if (ACTIVE === "voice") bindAssetsCard()
  if (ACTIVE === "freq") {
    const b = $("topicsReload")
    if (b) b.onclick = async function () {
      const box = $("topicsBox")
      if (box) box.innerHTML = '<div class="hint">刷新中…</div>'
      try {
        const j = await mg({ action: "mgmt", kind: "topics" })
        if (box) box.innerHTML = (j && j.ok !== false)
          ? topicsRowsHtml(j.rows || [])
          : ('<div class="hint" style="color:#ff6b6b">读话题失败：' + escapeHtml((j && j.error) || "") + '</div>')
      } catch (e) {
        if (box) box.innerHTML = '<div class="hint" style="color:#ff6b6b">读话题失败：' + escapeHtml(e.message) + '</div>'
      }
    }
  }
  if (ACTIVE === "memory") bindCardsCard()
  if (ACTIVE === "usage") loadSafety($("safetyBox"))
}

// 工具栏按页签显示，避免每个页都堆一排按钮
const TOOLBAR_OF = {
  syncSticker: ["sticker"],
  cleanSticker: ["sticker"],
  groupDiag: ["scope", "profile"],
  clearRoleCache: ["scope", "profile"],
}
function updateToolbar() {
  ;[...document.querySelectorAll(".toolbar [data-act]")].forEach((b) => {
    const allow = TOOLBAR_OF[b.dataset.act]
    b.style.display = !allow || allow.includes(ACTIVE) ? "" : "none"
  })
  const out = $("actout")
  if (out && !$("actmsg")?.textContent) out.textContent = ""
}
window.addEventListener("hashchange", () => {
  try {
    const hh = (location.hash || "").replace(/^#/, "")
    if (hh && STATE && STATE.tabs.some((t) => t[0] === hh) && hh !== ACTIVE) {
      ACTIVE = hh; renderTabs(); renderPanel(); try { updateToolbar() } catch {}
    }
  } catch {}
})

load()
